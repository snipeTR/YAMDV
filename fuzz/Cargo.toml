[package]
name = "yamdv-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yamdv-core = { path = "../crates/yamdv-core" }
yamdv-layout = { path = "../crates/yamdv-layout" }
yamdv-highlight = { path = "../crates/yamdv-highlight" }
yamdv-math = { path = "../crates/yamdv-math" }
yamdv-mermaid = { path = "../crates/yamdv-mermaid" }
yamdv-svg = { path = "../crates/yamdv-svg" }
yamdv-editor = { path = "../crates/yamdv-editor" }
yamdv-export = { path = "../crates/yamdv-export" }
pdf-writer = { version = "=0.15.0", default-features = false }
pulldown-cmark = { version = "=0.13.5", default-features = false }

# Not part of the product workspace (nightly-only, S-TEST-01).
[workspace]

