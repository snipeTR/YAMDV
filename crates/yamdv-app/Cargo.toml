[package]
name = "yamdv-app"
description = "YAMDV application binary (yamdv.exe): composition root, CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "yamdv"
path = "src/main.rs"

[features]
# Developer tools (`--render-png`, `--autoscroll`, `--perf-log`); never in release builds.
dev-tools = ["yamdv-platform-win/dev-tools"]
# Subsystem memory breakdown (`--mem-stats`), measurement builds only.
mem-stats = ["yamdv-platform-win/mem-stats"]
# Allocation-site tags (`YAMDV_ALLOC_DUMP`, prompt 019 F-39), measurement builds only.
alloc-sites = ["yamdv-platform-win/alloc-sites"]

[dependencies]
yamdv-platform-win = { path = "../yamdv-platform-win" }

[lints]
workspace = true
