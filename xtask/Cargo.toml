[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# 018a: pdf-inspect (dev tool only, never linked into yamdv.exe).
lopdf = { version = "=0.46.0", default-features = false }
object = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true, features = ["png-format"] }
# 020 §5.2: `cargo xtask icons` builds the toolbar icon table with the product SVG parser.
yamdv-svg = { path = "../crates/yamdv-svg" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

# Complete lint table (ARCHITECTURE §E.9): unsafe is denied and allowed only in the Win32 memprobe module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
